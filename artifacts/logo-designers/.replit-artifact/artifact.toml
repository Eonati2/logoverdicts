kind = "web"
previewPath = "/"
title = "Best Freelance Logo Designers"
version = "1.0.0"
id = "artifacts/logo-designers"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24006

[services.development]
run = "pnpm --filter @workspace/logo-designers run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/logo-designers", "run", "build" ]
publicDir = "artifacts/logo-designers/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24006"
BASE_PATH = "/"
